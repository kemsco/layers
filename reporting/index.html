<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Agence SEO</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            transitionProperty: {
              'strict': 'background-color, border-color, color, opacity',
            }
          }
        }
      }
    </script>
    
    <!-- React & ReactDOM (Versions stables) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- Vanilla Lucide -->
    <script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0A0A0A;
            color: #FFFFFF;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #383838; }
        
        /* Outline reset for strict focus styles */
        *:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = window.React;

        /* Pont sur-mesure pour les icônes Lucide */
        const Icon = ({ iconName, className, strokeWidth, onClick, ...rest }) => {
            const iconData = window.lucide.icons[iconName];
            if (!iconData) return <span className={className}></span>;
            const [, attrs, children] = iconData;
            const mapAttrs = (attributes) => {
                const res = { ...attributes };
                ['stroke-width', 'stroke-linecap', 'stroke-linejoin', 'fill-rule', 'clip-rule', 'class'].forEach(k => {
                    if (res[k] !== undefined) {
                        if (k === 'class') res.className = res[k];
                        else res[k.replace(/-([a-z])/g, g => g[1].toUpperCase())] = res[k];
                        delete res[k];
                    }
                });
                return res;
            };
            const svgAttrs = mapAttrs(attrs);
            const finalClassName = [svgAttrs.className, className].filter(Boolean).join(' ');
            return React.createElement(
                'svg',
                { ...svgAttrs, ...rest, className: finalClassName, strokeWidth: strokeWidth || svgAttrs.strokeWidth, onClick },
                children.map((child, i) => React.createElement(child[0], { ...mapAttrs(child[1]), key: i }))
            );
        };

        const lucideProxy = new Proxy({}, {
            get: function(target, prop) {
                return (props) => React.createElement(Icon, { iconName: prop, ...props });
            }
        });

        const { 
          Home, Inbox, Settings, Eye, Radio, Users, MessageSquare, FileText, 
          Globe, HelpCircle, ChevronDown, Sun, Building2, Share2, 
          ChevronRight, Calendar, Play, TrendingUp, Activity, Info, MoreHorizontal,
          LayoutDashboard, BarChart2, BarChart, LogOut, ChevronLeft,
          MapPin, ArrowUpRight, CheckCircle2, Map: MapIcon, Folder, ArrowLeft,
          X, Link, Copy, Filter, CheckCheck
        } = lucideProxy;

        // UI Components (Strict Design System)
        const HeroSection = ({ title, subtitle }) => (
          <div className="relative py-[40px] px-[24px] mb-[32px] overflow-hidden" style={{ backgroundImage: 'radial-gradient(ellipse at center, #1A1A1A 0%, #0A0A0A 100%)' }}>
            <div className="absolute inset-0 mix-blend-overlay opacity-5 pointer-events-none" style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")` }}></div>
            <div className="relative z-10 max-w-7xl mx-auto">
              <h1 className="text-[38px] sm:text-[40px] font-black text-[#FFFFFF] uppercase tracking-[0.01em] mb-[8px] leading-[1.1]">{title}</h1>
              <p className="text-[15px] italic font-normal text-[#B0B0B0]">{subtitle}</p>
            </div>
          </div>
        );

        const Container = ({ children, className = "" }) => (
          <div className={`bg-[#141414] border border-[#1E1E1E] rounded-[10px] p-[20px] ${className}`}>
            {children}
          </div>
        );

        const StandardButton = ({ children, onClick, className = "" }) => (
          <button onClick={onClick} className={`bg-[#1C1C1C] border border-[#2A2A2A] hover:bg-[#202020] hover:border-[#383838] transition-strict duration-150 ease-in-out rounded-[4px] px-[16px] py-[8px] flex items-center gap-[8px] text-[13px] font-medium text-[#A0A0A0] hover:text-[#FFFFFF] focus:border-[#00C9A7] duration-200 ${className}`}>
            {children}
          </button>
        );

        const SidebarItemDark = ({ icon: Icon, label, active, onClick }) => (
          <div onClick={onClick} className={`flex items-center px-[8px] py-[8px] mb-[4px] rounded-[4px] cursor-pointer transition-strict duration-150 ease-in-out text-[13px] ${active ? 'bg-[#1C1C1C] border border-[#2A2A2A] text-[#FFFFFF] font-medium' : 'text-[#808080] border border-transparent hover:bg-[#1C1C1C] hover:text-[#FFFFFF]'}`}>
            <Icon className="w-[14px] h-[14px] mr-[8px]" strokeWidth={active ? 2.5 : 2} />
            <span>{label}</span>
          </div>
        );

        const CardWrapper = ({ id, title, colSpan = 1, isClientView, clientCards, setClientCards, children }) => {
          const [menuOpen, setMenuOpen] = useState(false);
          const isAdded = clientCards.includes(id);
          const toggleClientView = () => {
            if (isAdded) setClientCards(clientCards.filter(cardId => cardId !== id));
            else setClientCards([...clientCards, id]);
            setMenuOpen(false);
          };
          const colSpanClass = colSpan === 2 ? 'col-span-2' : 'col-span-1';

          return (
            <div className={`bg-[#1C1C1C] border border-[#2A2A2A] hover:bg-[#202020] hover:border-[#383838] focus-within:border-[#00C9A7] transition-strict duration-150 ease-in-out rounded-[8px] px-[16px] py-[20px] relative ${colSpanClass} flex flex-col`}>
              <div className="flex justify-between items-start mb-[16px]">
                <div className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060]">{title}</div>
                <div className="relative">
                  <button onClick={() => setMenuOpen(!menuOpen)} className="text-[#A0A0A0] hover:text-[#FFFFFF] transition-strict duration-150 rounded-[4px] focus:outline-none">
                    <MoreHorizontal className="w-[14px] h-[14px]" />
                  </button>
                  {menuOpen && (
                    <div className="absolute right-0 top-6 w-48 bg-[#141414] border border-[#1E1E1E] rounded-[8px] z-20 p-[8px]">
                      <div className={`px-[8px] py-[8px] rounded-[4px] text-[11px] font-normal cursor-pointer transition-strict duration-150 hover:bg-[#1C1C1C] hover:text-[#FFFFFF] ${isAdded ? 'text-[#FFFFFF]' : 'text-[#A0A0A0]'}`} onClick={toggleClientView}>
                        {isClientView ? "Enlever de la vue client" : (isAdded ? "Retirer de la vue client" : "Ajouter à la vue client")}
                      </div>
                    </div>
                  )}
                </div>
              </div>
              <div className="flex-1 flex flex-col justify-end">
                {children}
              </div>
            </div>
          );
        };

        // Main App
        function App() {
          const [currentView, setCurrentView] = useState('dashboard'); 
          const [selectedClient, setSelectedClient] = useState('all');
          const [selectedProduct, setSelectedProduct] = useState('all');
          const [inboxSelectedClient, setInboxSelectedClient] = useState('all');
          
          const [activeDetailTab, setActiveDetailTab] = useState('global'); 
          const [clientCards, setClientCards] = useState(['health', 'top3']); 
          const [settingsOpen, setSettingsOpen] = useState(false);
          const [reportTemporality, setReportTemporality] = useState('monthly');
          const [isClientSettingsModalOpen, setIsClientSettingsModalOpen] = useState(false);
          const [copied, setCopied] = useState(false);
          const [publishedReports, setPublishedReports] = useState(['g1', 'g2', 'm1', 't1']); 

          const toggleReportPublished = (id) => {
            if (publishedReports.includes(id)) setPublishedReports(publishedReports.filter(r => r !== id));
            else setPublishedReports([...publishedReports, id]);
          };

          const handleCopyLink = () => {
            const input = document.getElementById('client-link-input');
            if (input) {
              input.select();
              document.execCommand('copy');
              setCopied(true);
              setTimeout(() => setCopied(false), 2000);
            }
          };

          // Database
          const mockDB = {
            'Google': {
              products: ['Google Ads', 'Google Workspace', 'Google Cloud'],
              reports: [
                { id: 'g1', title: 'Audit SEO Mensuel', product: 'Google Workspace', date: '25 Mars 2026', status: 'Terminé' },
                { id: 'g2', title: 'Campagne d\'acquisition Q2', product: 'Google Ads', date: '20 Mars 2026', status: 'En cours' },
                { id: 'g3', title: 'Optimisation Infra', product: 'Google Cloud', date: '15 Mars 2026', status: 'Planifié' }
              ]
            },
            'Meta': {
              products: ['Facebook Ads', 'Instagram Shopping'],
              reports: [
                { id: 'm1', title: 'Bilan de campagne FB', product: 'Facebook Ads', date: '26 Mars 2026', status: 'Terminé' }
              ]
            },
            'Tesla': {
              products: ['Solar Panels', 'Superchargers'],
              reports: [
                { id: 't1', title: 'Audit de trafic organique', product: 'Solar Panels', date: '22 Mars 2026', status: 'En cours' }
              ]
            }
          };

          const inboxNotifications = [
            { id: 1, client: 'Google', title: 'Significant visibility increase detected', desc: 'Brand presence in AI responses increased 24% across enterprise contexts in the last 48 hours.', time: '2h ago', isUnread: true, tag: 'Critical', icon: TrendingUp, stat: '+24%', context: 'Enterprise contexts' },
            { id: 2, client: 'Tesla', title: 'New competitor frequently co-mentioned', desc: 'A new alternative appears in 18% of comparison queries where your brand is mentioned.', time: '4h ago', isUnread: true, tag: 'High', icon: Eye, stat: '+18%', context: 'Comparison queries' },
            { id: 3, client: 'Meta', title: 'Experiment #2847 completed', desc: 'Enterprise buyer persona analysis finished. Results show 12% attribution improvement.', time: '6h ago', isUnread: true, tag: 'High', icon: Activity, stat: '+12%', context: 'Attribution improvement' },
            { id: 4, client: 'Google', title: 'Pricing narrative shift detected', desc: 'AI systems now emphasize "value-based" framing over "premium" in 67% of pricing contexts.', time: 'Yesterday', isUnread: false, icon: MessageSquare, stat: '+67%', context: 'Pricing contexts' },
            { id: 5, client: 'Tesla', title: 'New high-influence source identified', desc: 'TechCrunch article from 3 days ago now appears in 34% of AI attribution chains.', time: 'Yesterday', isUnread: false, icon: Globe, stat: 'Top 3', context: 'TechCrunch chains' },
            { id: 6, client: 'Google', title: 'DNS configuration warning', desc: 'Domain on Namecheap is expiring in less than 30 days. Please renew to avoid disruptions.', time: '2 days ago', isUnread: false, tag: 'Critical', icon: Radio, stat: 'Action required', context: 'Namecheap' },
            { id: 7, client: 'Meta', title: 'Webflow structure issue', desc: 'Recent changes on Webflow site have caused a drop in rich snippet generations.', time: '3 days ago', isUnread: false, tag: 'Medium', icon: FileText, stat: '-15%', context: 'Rich snippets' },
            { id: 8, client: 'Tesla', title: 'Email deliverability alert', desc: 'Instantly outreach campaigns are experiencing higher bounce rates. Check MX records.', time: '1 week ago', isUnread: false, icon: Inbox, stat: 'Review needed', context: 'Instantly / DNS' },
          ];

          const filteredNotifications = inboxSelectedClient === 'all' ? inboxNotifications : inboxNotifications.filter(n => n.client === inboxSelectedClient);
          const currentReportObj = (selectedClient !== 'all' && mockDB[selectedClient]) ? mockDB[selectedClient].reports.find(r => r.product === selectedProduct) : null;
          const isCurrentReportPublished = currentReportObj ? publishedReports.includes(currentReportObj.id) : false;

          // Reports Definition
          const reportCategories = [
            { id: 'presence', name: 'Présence & Technique', icon: Radio },
            { id: 'competitive', name: 'Competitive Landscape', icon: Users },
            { id: 'sources', name: 'Sources & Backlinks', icon: FileText },
            { id: 'narratives', name: 'Narratives & Mentions', icon: MessageSquare },
          ];

          const cardDefinitions = {
            'health': { category: 'presence', title: 'Score Santé Global', colSpan: 1, content: () => (
              <React.Fragment><div className="text-[24px] font-bold text-[#FFFFFF] mb-[4px]">92/100</div><div className="text-[11px] font-normal text-[#606060] leading-[1.5] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">+2pts vs mois précédent</div></React.Fragment>
            )},
            'indexation': { category: 'presence', title: 'Indexation Domaines', colSpan: 1, content: () => (
              <React.Fragment><div className="text-[24px] font-bold text-[#FFFFFF] mb-[4px]">14,205</div><div className="text-[11px] font-normal text-[#606060] leading-[1.5] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">99.8% couverture sitemap</div></React.Fragment>
            )},
            'dns': { category: 'presence', title: 'Erreurs DNS / MX', colSpan: 1, content: () => (
              <React.Fragment><div className="text-[24px] font-bold text-[#FFFFFF] mb-[4px]">3</div><div className="text-[11px] font-normal text-[#606060] leading-[1.5] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">À corriger sur Instantly / Namecheap</div></React.Fragment>
            )},
            'sov': { category: 'competitive', title: 'Part de Voix (Share of Voice) SEO', colSpan: 2, content: () => (
              <React.Fragment>
                <div className="h-[4px] w-full bg-[#141414] rounded-[2px] overflow-hidden flex mb-[16px] mt-[8px]">
                  <div className="bg-[#FFFFFF]" style={{width: '45%'}}></div><div className="bg-[#A0A0A0]" style={{width: '30%'}}></div><div className="bg-[#606060]" style={{width: '15%'}}></div><div className="bg-[#2A2A2A]" style={{width: '10%'}}></div>
                </div>
                <div className="flex gap-[16px] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">
                  <span className="flex items-center text-[11px] font-normal text-[#606060]"><span className="w-[8px] h-[8px] rounded-[4px] bg-[#FFFFFF] mr-[4px]"></span> Notre Marque (45%)</span>
                  <span className="flex items-center text-[11px] font-normal text-[#606060]"><span className="w-[8px] h-[8px] rounded-[4px] bg-[#A0A0A0] mr-[4px]"></span> Microsoft (30%)</span>
                </div>
              </React.Fragment>
            )},
            'top3': { category: 'competitive', title: 'Mots-clés en Top 3', colSpan: 1, content: () => (
              <React.Fragment><div className="text-[24px] font-bold text-[#FFFFFF] mb-[4px]">842</div><div className="text-[11px] font-normal text-[#606060] leading-[1.5] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">+12% vs concurrent principal</div></React.Fragment>
            )},
            'domains': { category: 'sources', title: 'Nouveaux Domaines', colSpan: 1, content: () => (
              <React.Fragment><div className="text-[24px] font-bold text-[#FFFFFF] mb-[4px]">+124</div><div className="text-[11px] font-normal text-[#606060] leading-[1.5] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">Domaines référents acquis</div></React.Fragment>
            )},
            'toxic': { category: 'sources', title: 'Liens Toxiques', colSpan: 1, content: () => (
              <React.Fragment><div className="text-[24px] font-bold text-[#FFFFFF] mb-[4px]">12</div><div className="text-[11px] font-normal text-[#606060] leading-[1.5] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">Fichier Disavow requis</div></React.Fragment>
            )},
            'anchors': { category: 'sources', title: 'Top Ancre de Lien', colSpan: 2, content: () => (
              <React.Fragment>
                <div className="flex flex-col gap-[8px] mt-[8px]">
                  <div className="flex justify-between items-center"><span className="text-[13px] font-medium text-[#FFFFFF]">"Solutions collaboratives cloud"</span><span className="text-[11px] font-normal text-[#606060] border border-[#2A2A2A] rounded-[4px] px-[8px] py-[2px]">42%</span></div>
                  <div className="flex justify-between items-center"><span className="text-[13px] font-medium text-[#FFFFFF]">"Alternative Office"</span><span className="text-[11px] font-normal text-[#606060] border border-[#2A2A2A] rounded-[4px] px-[8px] py-[2px]">18%</span></div>
                </div>
              </React.Fragment>
            )},
            'sentiment': { category: 'narratives', title: 'Sentiment Positif Dominant', colSpan: 1, content: () => (
              <React.Fragment><div className="text-[24px] font-bold text-[#FFFFFF] mb-[4px]">85%</div><div className="text-[11px] font-normal text-[#606060] leading-[1.5] mt-[16px] border-t border-[#2A2A2A] pt-[16px]">Intention de recherche transactionnelle.</div></React.Fragment>
            )},
            'trends': { category: 'narratives', title: 'Sujets en forte tendance (30j)', colSpan: 1, content: () => (
              <div className="flex flex-wrap gap-[8px] mt-[8px]">
                <span className="px-[8px] py-[4px] border border-[#2A2A2A] text-[#A0A0A0] text-[11px] rounded-[4px] font-normal">Sécurité des données</span>
                <span className="px-[8px] py-[4px] border border-[#2A2A2A] text-[#A0A0A0] text-[11px] rounded-[4px] font-normal">Intégration IA</span>
                <span className="px-[8px] py-[4px] border border-[#2A2A2A] text-[#A0A0A0] text-[11px] rounded-[4px] font-normal">Migration Webflow</span>
              </div>
            )}
          };

          const renderGrid = (category, cardsToRender, isClientView = false) => {
            const cardsInCategory = Object.entries(cardDefinitions).filter(([id, def]) => def.category === category.id && cardsToRender.includes(id));
            if (cardsInCategory.length === 0) return null;
            return (
              <div key={category.id} className="mb-[32px]">
                <h3 className="text-[13px] font-medium text-[#FFFFFF] mb-[16px] flex items-center">
                  {category.name}
                </h3>
                <Container>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-[12px]">
                    {cardsInCategory.map(([id, def]) => (
                      <CardWrapper key={id} id={id} title={def.title} colSpan={def.colSpan} isClientView={isClientView} clientCards={clientCards} setClientCards={setClientCards}>
                        {def.content()}
                      </CardWrapper>
                    ))}
                  </div>
                </Container>
              </div>
            );
          };

          return (
            <div className="flex h-screen w-full bg-[#0A0A0A] font-sans text-[#FFFFFF] overflow-hidden">
              
              {/* MODALS */}
              {isClientSettingsModalOpen && selectedClient !== 'all' && (
                <div className="fixed inset-0 bg-[#0A0A0A]/80 z-[100] flex items-center justify-center p-[24px]">
                  <div className="bg-[#141414] border border-[#1E1E1E] rounded-[10px] w-full max-w-lg flex flex-col">
                    <div className="px-[24px] py-[16px] border-b border-[#1E1E1E] flex justify-between items-center">
                      <h2 className="text-[13px] font-medium text-[#FFFFFF]">Paramètres Client : {selectedClient}</h2>
                      <button onClick={() => setIsClientSettingsModalOpen(false)} className="text-[#A0A0A0] hover:text-[#FFFFFF] transition-strict duration-150">
                        <X className="w-[14px] h-[14px]"/>
                      </button>
                    </div>
                    <div className="p-[24px] flex flex-col gap-[24px]">
                      <div>
                        <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[8px] block">Lien unique du portail</label>
                        <div className="flex items-center gap-[8px]">
                          <input id="client-link-input" value={`https://agence-seo.com/portail/${selectedClient.toLowerCase().replace(/\s+/g, '-')}`} readOnly className="flex-1 bg-[#1C1C1C] border border-[#2A2A2A] rounded-[4px] px-[12px] py-[8px] text-[13px] text-[#FFFFFF]" />
                          <StandardButton onClick={handleCopyLink}>{copied ? 'Copié' : 'Copier'}</StandardButton>
                        </div>
                        <p className="text-[11px] text-[#606060] mt-[8px] leading-[1.5]">Ce lien donne accès uniquement aux rapports que vous avez activés ci-dessous.</p>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[8px] block">Rapports publiés sur le portail</label>
                        <div className="flex flex-col gap-[8px] border border-[#1E1E1E] rounded-[8px] p-[8px] max-h-[200px] overflow-y-auto">
                          {mockDB[selectedClient].reports.map(r => (
                            <div key={r.id} className="flex items-center justify-between p-[12px] bg-[#1C1C1C] border border-[#2A2A2A] rounded-[4px]">
                              <div>
                                <div className="text-[13px] font-medium text-[#FFFFFF]">{r.title}</div>
                                <div className="text-[11px] text-[#606060] mt-[4px]">{r.product}</div>
                              </div>
                              <button onClick={() => toggleReportPublished(r.id)} className="text-[#A0A0A0] hover:text-[#FFFFFF] text-[11px] border border-[#2A2A2A] rounded-[4px] px-[8px] py-[4px]">
                                {publishedReports.includes(r.id) ? "ON" : "OFF"}
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* SIDEBAR */}
              <aside className="w-[160px] h-full bg-[#111111] border-r border-[#1E1E1E] flex flex-col flex-shrink-0 z-40">
                <div className="h-[44px] flex items-center px-[16px] border-b border-[#1E1E1E]">
                  <BarChart className="w-[14px] h-[14px] text-[#00C9A7] mr-[8px]" />
                  <span className="text-[13px] font-medium text-[#FFFFFF]">Agence SEO</span>
                </div>
                <div className="flex-1 flex flex-col overflow-y-auto">
                  <div className="px-[16px] mt-[24px] mb-[12px] text-[9px] font-bold uppercase tracking-[0.10em] text-[#4A4A4A]">Menu</div>
                  <nav className="flex flex-col px-[8px] gap-[4px]">
                    <SidebarItemDark onClick={() => setCurrentView('dashboard')} icon={LayoutDashboard} label="Dashboard" active={currentView === 'dashboard'} />
                    <SidebarItemDark onClick={() => setCurrentView('reports')} icon={BarChart2} label="Reports" active={currentView === 'reports' || currentView === 'report-detail'} />
                    <SidebarItemDark onClick={() => setCurrentView('inbox')} icon={Inbox} label="Inbox" active={currentView === 'inbox'} />
                  </nav>
                </div>
                <div className="p-[8px] border-t border-[#1E1E1E] flex flex-col gap-[4px]">
                  <SidebarItemDark icon={Settings} label="Settings" />
                  <SidebarItemDark icon={HelpCircle} label="Help & Methodology" />
                  <SidebarItemDark icon={Globe} label="English" />

                      <HeroSection title="INBOX" subtitle="Signaux d'intelligence générés par le système et alertes SEO." />
                      <div className="px-[24px]">
                        
                        <Container className="mb-[32px] flex justify-between items-center">
                          <div className="flex gap-[12px]">
                            <select className="bg-[#1C1C1C] border border-[#2A2A2A] text-[#A0A0A0] text-[13px] px-[16px] py-[8px] rounded-[4px]" value={inboxSelectedClient} onChange={(e) => setInboxSelectedClient(e.target.value)}>
                              <option value="all">Tous les clients</option>
                              {Object.keys(mockDB).map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                            <StandardButton><Filter className="w-[14px] h-[14px]"/> Filtrer</StandardButton>
                          </div>
                          <StandardButton><CheckCheck className="w-[14px] h-[14px]"/> Tout marquer comme lu</StandardButton>
                        </Container>

                        <div className="flex gap-[16px] mb-[32px]">
                          <div className="flex gap-[16px] bg-[#141414] border border-[#1E1E1E] rounded-[10px] p-[8px]">
                            <button className="text-[13px] text-[#FFFFFF] bg-[#1C1C1C] border border-[#2A2A2A] rounded-[4px] px-[16px] py-[4px]">All <span className="text-[#606060] ml-[4px]">7</span></button>
                            <button className="text-[13px] text-[#808080] hover:text-[#FFFFFF] px-[16px] py-[4px] transition-strict duration-150">Unread <span className="text-[#A0A0A0] ml-[4px]">3</span></button>
                            <button className="text-[13px] text-[#808080] hover:text-[#FFFFFF] px-[16px] py-[4px] transition-strict duration-150">Archived</button>
                          </div>
                        </div>

                        <Container>
                          <div className="flex flex-col gap-[12px]">
                            {filteredNotifications.map((notif) => (
                              <div key={notif.id} className="bg-[#1C1C1C] border border-[#2A2A2A] hover:bg-[#202020] hover:border-[#383838] transition-strict duration-150 rounded-[8px] p-[20px] flex items-start gap-[16px] cursor-pointer">
                                <div className="mt-[2px]"><notif.icon className="w-[14px] h-[14px] text-[#A0A0A0]" /></div>
                                <div className="flex-1">
                                  <div className="flex items-center gap-[8px] mb-[8px]">
                                    <h4 className="text-[13px] font-medium text-[#FFFFFF]">{notif.title}</h4>
                                    {notif.tag && <span className="border border-[#2A2A2A] rounded-[4px] px-[8px] py-[2px] text-[9px] font-bold uppercase tracking-[0.10em] text-[#A0A0A0]">{notif.tag}</span>}
                                    <span className="text-[11px] text-[#606060]">Client: {notif.client}</span>
                                  </div>
                                  <p className="text-[11px] text-[#A0A0A0] leading-[1.5] mb-[12px]">{notif.desc}</p>
                                  <div className="flex gap-[8px] text-[11px]"><span className="text-[#FFFFFF]">{notif.stat}</span><span className="text-[#606060]">· {notif.context}</span></div>
                                </div>
                                <div className="text-[11px] text-[#606060]">{notif.time}</div>
                              </div>
                            ))}
                            {filteredNotifications.length === 0 && (
                              <div className="py-[40px] text-center text-[13px] text-[#606060]">Aucune notification pour {inboxSelectedClient}.</div>
                            )}
                          </div>
                        </Container>

                      </div>
                    </div>
                  )}

                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
