<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Agence SEO</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            transitionProperty: {
              'strict': 'background-color, border-color, color, opacity',
            }
          }
        }
      }
    </script>
    
    <!-- React & ReactDOM (Versions stables) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- Vanilla Lucide -->
    <script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0A0A0A;
            color: #FFFFFF;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #383838; }
        
        *:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = window.React;

        /* Pont sur-mesure pour les icônes Lucide */
        const Icon = ({ iconName, className, strokeWidth, onClick, ...rest }) => {
            const iconData = window.lucide.icons[iconName];
            if (!iconData) return <span className={className}></span>;
            const [, attrs, children] = iconData;
            const mapAttrs = (attributes) => {
                const res = { ...attributes };
                ['stroke-width', 'stroke-linecap', 'stroke-linejoin', 'fill-rule', 'clip-rule', 'class'].forEach(k => {
                    if (res[k] !== undefined) {
                        if (k === 'class') res.className = res[k];
                        else res[k.replace(/-([a-z])/g, g => g[1].toUpperCase())] = res[k];
                        delete res[k];
                    }
                });
                return res;
            };
            const svgAttrs = mapAttrs(attrs);
            const finalClassName = [svgAttrs.className, className].filter(Boolean).join(' ');
            return React.createElement(
                'svg',
                { ...svgAttrs, ...rest, className: finalClassName, strokeWidth: strokeWidth || svgAttrs.strokeWidth, onClick },
                children.map((child, i) => React.createElement(child[0], { ...mapAttrs(child[1]), key: i }))
            );
        };

        const lucideProxy = new Proxy({}, {
            get: function(target, prop) {
                return (props) => React.createElement(Icon, { iconName: prop, ...props });
            }
        });

        const { 
          Home, Inbox, Settings, Eye, Radio, Users, MessageSquare, FileText, 
          Globe, HelpCircle, ChevronDown, Sun, Building2, Share2, 
          ChevronRight, Calendar, Play, TrendingUp, Activity, Info, MoreHorizontal,
          LayoutDashboard, BarChart2, BarChart, LogOut, ChevronLeft,
          MapPin, ArrowUpRight, CheckCircle2, Map: MapIcon, Folder, ArrowLeft,
          X, Link, Copy, Filter, CheckCheck, Check, Edit2, Plus
        } = lucideProxy;

        // UI Components (Strict Design System)
        const HeroSection = ({ title, subtitle }) => (
          <div className="relative py-[40px] px-[24px] mb-[32px] overflow-hidden" style={{ backgroundImage: 'radial-gradient(ellipse at center, #1A1A1A 0%, #0A0A0A 100%)' }}>
            <div className="absolute inset-0 mix-blend-overlay opacity-5 pointer-events-none" style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")` }}></div>
            <div className="relative z-10 max-w-7xl mx-auto">
              <h1 className="text-[38px] sm:text-[40px] font-black text-[#FFFFFF] uppercase tracking-[0.01em] mb-[8px] leading-[1.1]">{title}</h1>
              <p className="text-[15px] italic font-normal text-[#B0B0B0]">{subtitle}</p>
            </div>
          </div>
        );

        const Container = ({ children, className = "" }) => (
          <div className={`bg-[#141414] border border-[#1E1E1E] rounded-[10px] p-[20px] ${className}`}>
            {children}
          </div>
        );

        const StandardButton = ({ children, onClick, className = "", disabled = false }) => (
          <button type="button" disabled={disabled} onClick={onClick} className={`bg-[#1C1C1C] border transition-strict duration-150 ease-in-out rounded-[4px] px-[16px] py-[8px] flex items-center gap-[8px] text-[13px] font-medium ${disabled ? 'border-[#1E1E1E] text-[#4A4A4A] cursor-not-allowed' : 'border-[#2A2A2A] hover:bg-[#202020] hover:border-[#383838] text-[#A0A0A0] hover:text-[#FFFFFF] focus:border-[#00C9A7]'} ${className}`}>
            {children}
          </button>
        );

        const SidebarItemDark = ({ icon: Icon, label, active, onClick }) => (
          <div onClick={onClick} className={`flex items-center px-[8px] py-[8px] mb-[4px] rounded-[4px] cursor-pointer transition-strict duration-150 ease-in-out text-[13px] ${active ? 'bg-[#1C1C1C] border border-[#2A2A2A] text-[#FFFFFF] font-medium' : 'text-[#808080] border border-transparent hover:bg-[#1C1C1C] hover:text-[#FFFFFF]'}`}>
            <Icon className="w-[14px] h-[14px] mr-[8px]" strokeWidth={active ? 2.5 : 2} />
            <span>{label}</span>
          </div>
        );

        const CardWrapper = ({ id, title, colSpan = 1, isClientView, clientCards, setClientCards, children }) => {
          const [menuOpen, setMenuOpen] = useState(false);
          const isAdded = clientCards.includes(id);
          const toggleClientView = () => {
            if (isAdded) setClientCards(clientCards.filter(cardId => cardId !== id));
            else setClientCards([...clientCards, id]);
            setMenuOpen(false);
          };
          const colSpanClass = colSpan === 2 ? 'col-span-2' : 'col-span-1';

          return (
            <div className={`bg-[#1C1C1C] border border-[#2A2A2A] hover:bg-[#202020] hover:border-[#383838] focus-within:border-[#00C9A7] transition-strict duration-150 ease-in-out rounded-[8px] px-[16px] py-[20px] relative ${colSpanClass} flex flex-col`}>
              <div className="flex justify-between items-start mb-[16px]">
                <div className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060]">{title}</div>
                <div className="relative">
                  <button type="button" onClick={() => setMenuOpen(!menuOpen)} className="text-[#A0A0A0] hover:text-[#FFFFFF] transition-strict duration-150 rounded-[4px] focus:outline-none">
                    <MoreHorizontal className="w-[14px] h-[14px]" />
                  </button>
                  {menuOpen && (
                    <div className="absolute right-0 top-6 w-48 bg-[#141414] border border-[#1E1E1E] rounded-[8px] z-20 p-[8px]">
                      <div className={`px-[8px] py-[8px] rounded-[4px] text-[11px] font-normal cursor-pointer transition-strict duration-150 hover:bg-[#1C1C1C] hover:text-[#FFFFFF] ${isAdded ? 'text-[#FFFFFF]' : 'text-[#A0A0A0]'}`} onClick={toggleClientView}>
                        {isClientView ? "Enlever de la vue client" : (isAdded ? "Retirer de la vue client" : "Ajouter à la vue client")}
                      </div>
                    </div>
                  )}
                </div>
              </div>
              <div className="flex-1 flex flex-col justify-end">
                {children}
              </div>
            </div>
          );
        };

        // ====== WORKFLOW: CREATE REPORT FULLSCREEN OVERLAY ======
        const CreateReportFlow = ({ onClose }) => {
          const [step, setStep] = useState(1);
          const [data, setData] = useState({
            type: null,
            name: '',
            associatedBrand: '',
            url: '',
            target: null,
            industry: null,
            reportName: '',
            objectives: '',
            schedule: null,
            locations: '',
            neighborhoods: '',
            languages: '',
            template: null,
            competitorUrls: [''],
            seoQueries: '',
            personasType: null,
            keywordsType: null,
            savePrefs: false
          });

          // Handlers
          const update = (field, value) => setData(prev => ({ ...prev, [field]: value }));

          // Validation logic assouplie (6 étapes maintenant)
          const isStep1Valid = data.type !== null && data.name.trim() !== '' && data.target !== null && data.industry !== null;
          const isStep2Valid = data.reportName.trim() !== '' && data.schedule !== null && data.template !== null;
          const isStep3Valid = true; // Champs optionnels
          const isStep4Valid = data.personasType !== null;
          const isStep5Valid = data.keywordsType !== null;

          // Progressive disclosure flags for Step 1
          const showName = data.type !== null;
          const showAssocBrand = (data.type === 'product' || data.type === 'service') && data.name.trim() !== '';
          const showUrl = (data.type === 'brand' && data.name.trim() !== '') || (showAssocBrand && data.associatedBrand.trim() !== '');
          const showTarget = showUrl && data.url.trim() !== '';
          const showIndustry = showTarget && data.target !== null;

          const navigateStep = (newStep) => {
             if (newStep < step || 
                (newStep === 2 && isStep1Valid) || 
                (newStep === 3 && isStep1Valid && isStep2Valid) ||
                (newStep === 4 && isStep1Valid && isStep2Valid && isStep3Valid) ||
                (newStep === 5 && isStep1Valid && isStep2Valid && isStep3Valid && isStep4Valid) ||
                (newStep === 6 && isStep1Valid && isStep2Valid && isStep3Valid && isStep4Valid && isStep5Valid)) {
                 setStep(newStep);
             }
          };

          return (
            <div className="fixed inset-0 z-[200] bg-[#0A0A0A] overflow-y-auto animate-in fade-in duration-200 flex flex-col">
              
              {/* TOP HEADER & BREADCRUMB */}
              <div className="sticky top-0 bg-[#0D0D0D] border-b border-[#1E1E1E] z-10 px-[24px] h-[60px] flex items-center justify-between flex-shrink-0">
                <div className="flex items-center gap-[16px] text-[11px] font-bold uppercase tracking-[0.10em] overflow-x-auto whitespace-nowrap hide-scrollbar">
                  <span onClick={() => navigateStep(1)} className={`cursor-pointer transition-colors duration-150 flex-shrink-0 ${step >= 1 ? 'text-[#FFFFFF]' : 'text-[#4A4A4A]'}`}>1. Entité</span>
                  <span className="text-[#4A4A4A] flex-shrink-0">/</span>
                  <span onClick={() => navigateStep(2)} className={`cursor-pointer transition-colors duration-150 flex-shrink-0 ${step >= 2 ? 'text-[#FFFFFF]' : 'text-[#4A4A4A]'}`}>2. Config</span>
                  <span className="text-[#4A4A4A] flex-shrink-0">/</span>
                  <span onClick={() => navigateStep(3)} className={`cursor-pointer transition-colors duration-150 flex-shrink-0 ${step >= 3 ? 'text-[#FFFFFF]' : 'text-[#4A4A4A]'}`}>3. Périmètre</span>
                  <span className="text-[#4A4A4A] flex-shrink-0">/</span>
                  <span onClick={() => navigateStep(4)} className={`cursor-pointer transition-colors duration-150 flex-shrink-0 ${step >= 4 ? 'text-[#FFFFFF]' : 'text-[#4A4A4A]'}`}>4. Personas</span>
                  <span className="text-[#4A4A4A] flex-shrink-0">/</span>
                  <span onClick={() => navigateStep(5)} className={`cursor-pointer transition-colors duration-150 flex-shrink-0 ${step >= 5 ? 'text-[#FFFFFF]' : 'text-[#4A4A4A]'}`}>5. Mots-clés</span>
                  <span className="text-[#4A4A4A] flex-shrink-0">/</span>
                  <span onClick={() => navigateStep(6)} className={`cursor-pointer transition-colors duration-150 flex-shrink-0 ${step >= 6 ? 'text-[#FFFFFF]' : 'text-[#4A4A4A]'}`}>6. Résumé</span>
                </div>
                <button type="button" onClick={onClose} className="text-[#A0A0A0] hover:text-[#FFFFFF] transition-strict duration-150 p-[8px] flex-shrink-0 ml-[16px]">
                  <X className="w-[20px] h-[20px]" />
                </button>
              </div>

              <div className="flex-1 w-full max-w-3xl mx-auto px-[24px] pb-[100px] pt-[40px]">
                
                {/* ETAPE 1 : ENTITÉ */}
                {step === 1 && (
                  <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 flex flex-col gap-[32px]">
                    <h1 className="text-[32px] sm:text-[38px] font-black text-[#FFFFFF] uppercase tracking-[0.01em] mb-[16px] leading-[1.1] text-center">INITIALISATION</h1>
                    
                    <div>
                      <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Que souhaitez-vous analyser ?</label>
                      <div className="grid grid-cols-3 gap-[12px]">
                        {[{ id: 'brand', l: 'Marque' }, { id: 'product', l: 'Produit' }, { id: 'service', l: 'Service' }].map(opt => (
                          <button type="button" key={opt.id} onClick={() => update('type', opt.id)} className={`py-[16px] rounded-[8px] border transition-strict duration-150 text-[13px] font-medium ${data.type === opt.id ? 'bg-[#1C1C1C] border-[#00C9A7] text-[#FFFFFF]' : 'bg-[#1C1C1C] border-[#2A2A2A] text-[#A0A0A0] hover:border-[#383838] hover:text-[#FFFFFF]'}`}>{opt.l}</button>
                        ))}
                      </div>
                    </div>

                    {showName && (
                      <div className="animate-in fade-in duration-300">
                        <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">{data.type === 'brand' ? 'Nom de la marque' : data.type === 'product' ? 'Nom du produit' : 'Nom du service'}</label>
                        <input type="text" value={data.name} onChange={(e) => update('name', e.target.value)} placeholder="Saisissez le nom..." className="w-full bg-[#1C1C1C] border border-[#2A2A2A] rounded-[8px] px-[16px] py-[12px] text-[13px] text-[#FFFFFF] placeholder-[#4A4A4A] focus:border-[#00C9A7] transition-strict duration-200" />
                      </div>
                    )}

                    {showAssocBrand && (
                      <div className="animate-in fade-in duration-300">
                        <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Marque parente associée <span className="text-[#4A4A4A] lowercase ml-[4px]">(Optionnel)</span></label>
                        <input type="text" value={data.associatedBrand} onChange={(e) => update('associatedBrand', e.target.value)} placeholder="Ex: Google (pour Workspace)..." className="w-full bg-[#1C1C1C] border border-[#2A2A2A] rounded-[8px] px-[16px] py-[12px] text-[13px] text-[#FFFFFF] placeholder-[#4A4A4A] focus:border-[#00C9A7] transition-strict duration-200" />
                      </div>
                    )}

                    {showUrl && (
                      <div className="animate-in fade-in duration-300">
                        <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Lien web associé <span className="text-[#4A4A4A] lowercase ml-[4px]">(Optionnel)</span></label>
                        <div className="flex items-center bg-[#1C1C1C] border border-[#2A2A2A] rounded-[8px] focus-within:border-[#00C9A7] transition-strict duration-200 overflow-hidden">
                          <span className="pl-[16px] pr-[4px] text-[13px] text-[#606060] select-none">https://</span>
                          <input type="text" value={data.url} onChange={(e) => update('url', e.target.value)} placeholder="www.exemple.com" className="flex-1 bg-transparent py-[12px] pr-[16px] text-[13px] text-[#FFFFFF] placeholder-[#4A4A4A] outline-none" />
                        </div>
                      </div>
                    )}

                    {showTarget && (
                      <div className="animate-in fade-in duration-300">
                        <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Cible de l'entité</label>
                        <div className="grid grid-cols-3 gap-[12px]">
                          {[{ id: 'b2b', l: 'B2B' }, { id: 'b2c', l: 'B2C' }, { id: 'hybrid', l: 'HYBRIDE' }].map(opt => (
                            <button type="button" key={opt.id} onClick={() => update('target', opt.id)} className={`py-[16px] rounded-[8px] border transition-strict duration-150 text-[13px] font-medium ${data.target === opt.id ? 'bg-[#1C1C1C] border-[#00C9A7] text-[#FFFFFF]' : 'bg-[#1C1C1C] border-[#2A2A2A] text-[#A0A0A0] hover:border-[#383838] hover:text-[#FFFFFF]'}`}>{opt.l}</button>
                          ))}
                        </div>
                      </div>
                    )}

                    {showIndustry && (
                      <div className="animate-in fade-in duration-300">
                        <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Industrie principale</label>
                        <div className="grid grid-cols-3 gap-[12px]">
                          {[{ id: 'tech', l: 'Technologie & SaaS' }, { id: 'ecom', l: 'E-commerce' }, { id: 'local', l: 'Services Locaux' }].map(opt => (
                            <button type="button" key={opt.id} onClick={() => update('industry', opt.id)} className={`py-[16px] rounded-[8px] border transition-strict duration-150 text-[13px] font-medium ${data.industry === opt.id ? 'bg-[#1C1C1C] border-[#00C9A7] text-[#FFFFFF]' : 'bg-[#1C1C1C] border-[#2A2A2A] text-[#A0A0A0] hover:border-[#383838] hover:text-[#FFFFFF]'}`}>{opt.l}</button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* ETAPE 2 : CONFIGURATION */}
                {step === 2 && (
                  <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 flex flex-col gap-[32px]">
                    <h1 className="text-[32px] sm:text-[38px] font-black text-[#FFFFFF] uppercase tracking-[0.01em] mb-[16px] leading-[1.1] text-center">CONFIGURATION</h1>
                    
                    <div>
                      <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Nom du rapport</label>
                      <input type="text" value={data.reportName} onChange={(e) => update('reportName', e.target.value)} placeholder="Ex: Audit Mensuel SEO..." className="w-full bg-[#1C1C1C] border border-[#2A2A2A] rounded-[8px] px-[16px] py-[12px] text-[13px] text-[#FFFFFF] placeholder-[#4A4A4A] focus:border-[#00C9A7] transition-strict duration-200" />
                    </div>

                    <div>
                      <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Objectifs du rapport <span className="text-[#4A4A4A] lowercase ml-[4px]">(Optionnel)</span></label>
                      <textarea rows="4" value={data.objectives} onChange={(e) => update('objectives', e.target.value)} placeholder="Ce rapport a pour objectif d'analyser la marque sur ce sujet comparé à leurs compétiteurs..." className="w-full bg-[#1C1C1C] border border-[#2A2A2A] rounded-[8px] px-[16px] py-[12px] text-[13px] text-[#FFFFFF] placeholder-[#4A4A4A] focus:border-[#00C9A7] transition-strict duration-200 resize-none"></textarea>
                      <p className="text-[11px] text-[#606060] mt-[8px] leading-[1.5]">Cette partie vise à comprendre précisément les besoins du client pour adapter les analyses générées par nos modèles.</p>
                    </div>

                    <div>
                      <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Temporalité (Schedule)</label>
                      <div className="grid grid-cols-3 gap-[12px]">
                        {[{ id: 'daily', l: 'Quotidien' }, { id: 'weekly', l: 'Hebdomadaire' }, { id: 'monthly', l: 'Mensuel' }].map(opt => (
                          <button type="button" key={opt.id} onClick={() => update('schedule', opt.id)} className={`py-[12px] rounded-[8px] border transition-strict duration-150 text-[13px] font-medium ${data.schedule === opt.id ? 'bg-[#1C1C1C] border-[#00C9A7] text-[#FFFFFF]' : 'bg-[#1C1C1C] border-[#2A2A2A] text-[#A0A0A0] hover:border-[#383838] hover:text-[#FFFFFF]'}`}>{opt.l}</button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[12px] block">Modèles de templates</label>
                      <div className="grid grid-cols-3 gap-[16px]">
                        {/* CONCISE */}
                        <div onClick={() => update('template', 'concise')} className={`p-[16px] rounded-[8px] border transition-strict duration-150 cursor-pointer flex flex-col ${data.template === 'concise' ? 'bg-[#1C1C1C] border-[#00C9A7]' : 'bg-[#1C1C1C] border-[#2A2A2A] hover:border-[#383838]'}`}>
                          <div className="h-[60px] w-full border border-[#2A2A2A] rounded-[4px] mb-[16px] flex flex-col gap-[6px] p-[8px] opacity-60">
                             <div className="h-[8px] w-1/2 bg-[#4A4A4A] rounded-[2px]"></div>
                             <div className="h-[16px] w-full bg-[#2A2A2A] rounded-[2px]"></div>
                          </div>
                          <span className={`text-[13px] font-medium text-center ${data.template === 'concise' ? 'text-[#FFFFFF]' : 'text-[#A0A0A0]'}`}>Concise</span>
                        </div>
                        {/* DETAILED */}
                        <div onClick={() => update('template', 'detailed')} className={`p-[16px] rounded-[8px] border transition-strict duration-150 cursor-pointer flex flex-col ${data.template === 'detailed' ? 'bg-[#1C1C1C] border-[#00C9A7]' : 'bg-[#1C1C1C] border-[#2A2A2A] hover:border-[#383838]'}`}>
                          <div className="h-[60px] w-full border border-[#2A2A2A] rounded-[4px] mb-[16px] flex flex-col gap-[6px] p-[8px] opacity-80">
                             <div className="h-[8px] w-1/2 bg-[#4A4A4A] rounded-[2px]"></div>
                             <div className="flex gap-[4px] flex-1">
                               <div className="flex-1 bg-[#2A2A2A] rounded-[2px]"></div><div className="w-[12px] bg-[#4A4A4A] rounded-[2px]"></div>
                             </div>
                          </div>
                          <span className={`text-[13px] font-medium text-center ${data.template === 'detailed' ? 'text-[#FFFFFF]' : 'text-[#A0A0A0]'}`}>Detailed</span>
                        </div>
                        {/* FULL */}
                        <div onClick={() => update('template', 'full')} className={`p-[16px] rounded-[8px] border transition-strict duration-150 cursor-pointer flex flex-col ${data.template === 'full' ? 'bg-[#1C1C1C] border-[#00C9A7]' : 'bg-[#1C1C1C] border-[#2A2A2A] hover:border-[#383838]'}`}>
                          <div className="h-[60px] w-full border border-[#2A2A2A] rounded-[4px] mb-[16px] flex flex-col gap-[4px] p-[6px]">
                             <div className="h-[6px] w-1/2 bg-[#4A4A4A] rounded-[2px]"></div>
                             <div className="grid grid-cols-2 gap-[4px] flex-1">
                               <div className="bg-[#2A2A2A] rounded-[2px]"></div><div className="bg-[#383838] rounded-[2px]"></div>
                               <div className="bg-[#383838] rounded-[2px]"></div><div className="bg-[#2A2A2A] rounded-[2px]"></div>
                             </div>
                          </div>

                                      <div className="flex items-center gap-[12px]">
                                        <div className="w-[60px] h-[4px] bg-[#141414] rounded-[2px] overflow-hidden"><div className="h-full bg-[#FFFFFF]" style={{ width: row.pct }}></div></div>
                                        <span className="text-[11px] text-[#A0A0A0]">{row.pct}</span>
                                      </div>
                                    </td>
                                    <td className="py-[16px] px-[20px]"><span className="border border-[#2A2A2A] rounded-[4px] px-[8px] py-[4px] text-[11px] text-[#A0A0A0]">{row.status}</span></td>
                                    <td className="py-[16px] px-[20px] text-right"><span className="text-[13px] text-[#808080] hover:text-[#FFFFFF] transition-colors">{row.action}</span></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </Container>
                      </div>
                    </div>
                  )}

                  {currentView === 'reports' && (
                    <div className="pb-[40px]">
                      <HeroSection title={selectedClient === 'all' ? 'TOUS LES RAPPORTS' : `RAPPORTS : ${selectedClient}`} subtitle="Gérez et consultez les rapports générés pour vos clients." />
                      <div className="px-[24px]">
                        <Container className="mb-[32px] flex justify-between items-center">
                          <div className="flex gap-[12px]">
                            <select className="bg-[#1C1C1C] border border-[#2A2A2A] text-[#A0A0A0] text-[13px] px-[16px] py-[8px] rounded-[4px] focus:border-[#00C9A7] outline-none" value={selectedClient} onChange={(e) => { setSelectedClient(e.target.value); setSelectedProduct('all'); }}>
                              <option value="all">Tous les clients</option>
                              {Object.keys(mockDB).map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                            <select className={`bg-[#1C1C1C] border border-[#2A2A2A] text-[#A0A0A0] text-[13px] px-[16px] py-[8px] rounded-[4px] focus:border-[#00C9A7] outline-none transition-opacity duration-200 ${selectedClient === 'all' ? 'opacity-50 cursor-not-allowed' : ''}`} value={selectedProduct} onChange={(e) => setSelectedProduct(e.target.value)}>
                              <option value="all">Tous les produits</option>
                              {selectedClient !== 'all' && mockDB[selectedClient].products.map(p => <option key={p} value={p}>{p}</option>)}
                            </select>
                          </div>
                          {selectedClient !== 'all' && (
                            <StandardButton onClick={() => setIsClientSettingsModalOpen(true)}><Settings className="w-[14px] h-[14px]" /> Paramètres du client</StandardButton>
                          )}
                        </Container>

                        {selectedClient === 'all' ? (
                          <Container>
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-[12px]">
                              {Object.entries(mockDB).map(([clientName, data]) => (
                                <div key={clientName} onClick={() => setSelectedClient(clientName)} className="bg-[#1C1C1C] border border-[#2A2A2A] hover:bg-[#202020] hover:border-[#383838] transition-strict duration-150 rounded-[8px] p-[20px] cursor-pointer">
                                  <div className="w-[32px] h-[32px] rounded-[4px] border border-[#2A2A2A] flex items-center justify-center text-[13px] text-[#A0A0A0] mb-[16px]">{clientName.charAt(0)}</div>
                                  <h3 className="text-[13px] font-medium text-[#FFFFFF]">{clientName}</h3>
                                  <p className="text-[11px] text-[#606060] mt-[4px]">{data.reports.length} rapports disponibles</p>
                                </div>
                              ))}
                            </div>
                          </Container>
                        ) : (
                          <Container>
                            <div className="bg-[#1C1C1C] border border-[#2A2A2A] rounded-[8px] overflow-hidden">
                              <table className="w-full text-left border-collapse">
                                <thead><tr><th className="text-[9px] font-bold uppercase tracking-[0.10em] text-[#4A4A4A] py-[16px] px-[20px] border-b border-[#2A2A2A]">Nom du rapport</th><th className="text-[9px] font-bold uppercase tracking-[0.10em] text-[#4A4A4A] py-[16px] px-[20px] border-b border-[#2A2A2A]">Service</th><th className="text-[9px] font-bold uppercase tracking-[0.10em] text-[#4A4A4A] py-[16px] px-[20px] border-b border-[#2A2A2A]">Statut</th><th className="text-[9px] font-bold uppercase tracking-[0.10em] text-[#4A4A4A] py-[16px] px-[20px] border-b border-[#2A2A2A] text-right">Action</th></tr></thead>
                                <tbody>
                                  {mockDB[selectedClient].reports.filter(r => selectedProduct === 'all' || r.product === selectedProduct).map((report) => (
                                    <tr key={report.id} onClick={() => { setSelectedProduct(report.product); setCurrentView('report-detail'); setActiveDetailTab('global'); }} className="hover:bg-[#202020] transition-strict duration-150 border-b border-[#2A2A2A] last:border-0 cursor-pointer">
                                      <td className="py-[16px] px-[20px] text-[13px] text-[#FFFFFF]">{report.title}</td>
                                      <td className="py-[16px] px-[20px]"><span className="border border-[#2A2A2A] rounded-[4px] px-[8px] py-[4px] text-[11px] text-[#A0A0A0]">{report.product}</span></td>
                                      <td className="py-[16px] px-[20px]"><span className="border border-[#2A2A2A] rounded-[4px] px-[8px] py-[4px] text-[11px] text-[#A0A0A0]">{report.status}</span></td>
                                      <td className="py-[16px] px-[20px] text-right"><span className="text-[13px] text-[#808080] hover:text-[#FFFFFF] transition-colors">Ouvrir</span></td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </Container>
                        )}
                      </div>
                    </div>
                  )}

                  {currentView === 'report-detail' && selectedClient !== 'all' && (
                    <div className="pb-[40px]">
                      <HeroSection title={currentReportObj?.title || 'RAPPORT'} subtitle="Aperçu et configuration des données." />
                      <div className="px-[24px]">
                        <Container className="flex justify-between items-center mb-[32px]">
                          <div className="flex gap-[8px] items-center">
                            <button onClick={() => setCurrentView('reports')} className="text-[#808080] hover:text-[#FFFFFF] transition-strict duration-150"><ArrowLeft className="w-[14px] h-[14px]" /></button>
                            <button onClick={() => { setCurrentView('reports'); setSelectedClient('all'); setSelectedProduct('all'); }} className="text-[13px] text-[#808080] hover:text-[#FFFFFF] transition-strict duration-150 ml-[8px]">Tous les rapports</button>
                            <span className="text-[13px] text-[#4A4A4A]">/</span>
                            <span className="text-[13px] text-[#FFFFFF] font-medium">{selectedClient}</span>
                            <span className="text-[13px] text-[#4A4A4A]">/</span>
                            <span className="text-[13px] text-[#A0A0A0]">{selectedProduct}</span>
                          </div>
                          <div className="flex gap-[12px] relative">
                            <StandardButton onClick={() => setIsClientSettingsModalOpen(true)}><Globe className="w-[14px] h-[14px]" /> Paramètres du client</StandardButton>
                            <StandardButton onClick={() => setSettingsOpen(!settingsOpen)}><Settings className="w-[14px] h-[14px]" /> Paramètres pour ce rapport</StandardButton>
                            {settingsOpen && currentReportObj && (
                              <div className="absolute right-0 top-12 w-72 bg-[#141414] border border-[#1E1E1E] rounded-[10px] p-[20px] z-50">
                                <h4 className="text-[13px] font-medium text-[#FFFFFF] mb-[16px] border-b border-[#1E1E1E] pb-[8px]">Paramètres du Rapport</h4>
                                <div className="mb-[16px]">
                                  <label className="text-[11px] font-bold uppercase tracking-[0.10em] text-[#606060] mb-[8px] block">Temporalité</label>
                                  <select value={reportTemporality} onChange={(e) => setReportTemporality(e.target.value)} className="w-full bg-[#1C1C1C] border border-[#2A2A2A] text-[#FFFFFF] text-[13px] px-[12px] py-[8px] rounded-[4px] focus:border-[#00C9A7] outline-none">
                                    <option value="monthly">Mois par mois</option>
                                    <option value="weekly">Semaine par semaine</option>
                                    <option value="daily">Jour par jour</option>
                                  </select>
                                </div>
                                <div className="flex justify-between items-center border-t border-[#1E1E1E] pt-[16px]">
                                  <div><div className="text-[13px] text-[#FFFFFF]">Visibilité Client</div><div className="text-[11px] text-[#606060]">Activer sur le portail.</div></div>
                                  <button onClick={() => toggleReportPublished(currentReportObj.id)} className={`text-[11px] border border-[#2A2A2A] rounded-[4px] px-[8px] py-[4px] transition-strict duration-150 ${isCurrentReportPublished ? 'bg-[#1C1C1C] text-[#00C9A7] border-[#00C9A7]' : 'text-[#A0A0A0] hover:text-[#FFFFFF]'}`}>
                                    {isCurrentReportPublished ? 'ON' : 'OFF'}
                                  </button>
                                </div>
                              </div>
                            )}
                          </div>
                        </Container>

                        <div className="flex gap-[32px] mb-[32px] border-b border-[#1E1E1E]">
                          <button onClick={() => setActiveDetailTab('global')} className={`pb-[8px] text-[13px] transition-strict duration-150 border-b ${activeDetailTab === 'global' ? 'border-[#FFFFFF] text-[#FFFFFF] font-medium' : 'border-transparent text-[#808080] hover:text-[#FFFFFF]'}`}>Rapport Global (Consultant)</button>
                          <button onClick={() => setActiveDetailTab('client')} className={`pb-[8px] text-[13px] transition-strict duration-150 border-b flex items-center gap-[8px] ${activeDetailTab === 'client' ? 'border-[#FFFFFF] text-[#FFFFFF] font-medium' : 'border-transparent text-[#808080] hover:text-[#FFFFFF]'}`}>
                            Vue du client {clientCards.length > 0 && <span className="border border-[#2A2A2A] px-[4px] py-[2px] rounded-[4px] text-[9px]">{clientCards.length}</span>}
                          </button>
                        </div>

                        {activeDetailTab === 'global' ? (
                          <div>{reportCategories.map(cat => renderGrid(cat, Object.keys(cardDefinitions), false))}</div>
                        ) : (
                          <div>
                            {clientCards.length === 0 ? (
                              <Container className="flex flex-col items-center justify-center h-[300px]">
                                <Eye className="w-[32px] h-[32px] text-[#4A4A4A] mb-[16px]" />
                                <h3 className="text-[13px] text-[#FFFFFF] mb-[8px]">La vue client est vide</h3>
                                <p className="text-[11px] text-[#606060] mb-[24px]">Ajoutez des modules depuis le Rapport Global.</p>
                                <StandardButton onClick={() => setActiveDetailTab('global')}>Retourner au rapport</StandardButton>
                              </Container>
                            ) : (
                              <div>
                                <Container className="mb-[32px] flex gap-[12px] items-center">
                                  <Info className="w-[14px] h-[14px] text-[#606060]" />
                                  <div><div className="text-[13px] text-[#FFFFFF]">Aperçu du Dashboard Client</div><div className="text-[11px] text-[#606060]">Ce que le client verra sur son lien unique.</div></div>
                                </Container>
                                {reportCategories.map(cat => renderGrid(cat, clientCards, true))}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {currentView === 'inbox' && (
                    <div className="pb-[40px]">
                      <HeroSection title="INBOX" subtitle="Signaux d'intelligence générés par le système et alertes SEO." />
                      <div className="px-[24px]">
                        
                        <Container className="mb-[32px] flex justify-between items-center">
                          <div className="flex gap-[12px]">
                            <select className="bg-[#1C1C1C] border border-[#2A2A2A] focus:border-[#00C9A7] outline-none text-[#A0A0A0] text-[13px] px-[16px] py-[8px] rounded-[4px]" value={inboxSelectedClient} onChange={(e) => setInboxSelectedClient(e.target.value)}>
                              <option value="all">Tous les clients</option>
                              {Object.keys(mockDB).map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                            <StandardButton><Filter className="w-[14px] h-[14px]"/> Filtrer</StandardButton>
                          </div>
                          <StandardButton><CheckCheck className="w-[14px] h-[14px]"/> Tout marquer comme lu</StandardButton>
                        </Container>

                        <div className="flex gap-[16px] mb-[32px]">
                          <div className="flex gap-[16px] bg-[#141414] border border-[#1E1E1E] rounded-[10px] p-[8px]">
                            <button className="text-[13px] text-[#FFFFFF] bg-[#1C1C1C] border border-[#2A2A2A] rounded-[4px] px-[16px] py-[4px]">All <span className="text-[#606060] ml-[4px]">7</span></button>
                            <button className="text-[13px] text-[#808080] hover:text-[#FFFFFF] px-[16px] py-[4px] transition-strict duration-150">Unread <span className="text-[#A0A0A0] ml-[4px]">3</span></button>
                            <button className="text-[13px] text-[#808080] hover:text-[#FFFFFF] px-[16px] py-[4px] transition-strict duration-150">Archived</button>
                          </div>
                        </div>

                        <Container>
                          <div className="flex flex-col gap-[12px]">
                            {filteredNotifications.map((notif) => (
                              <div key={notif.id} className="bg-[#1C1C1C] border border-[#2A2A2A] hover:bg-[#202020] hover:border-[#383838] transition-strict duration-150 rounded-[8px] p-[20px] flex items-start gap-[16px] cursor-pointer">
                                <div className="mt-[2px]"><notif.icon className="w-[14px] h-[14px] text-[#A0A0A0]" /></div>
                                <div className="flex-1">
                                  <div className="flex items-center gap-[8px] mb-[8px]">
                                    <h4 className="text-[13px] font-medium text-[#FFFFFF]">{notif.title}</h4>
                                    {notif.tag && <span className="border border-[#2A2A2A] rounded-[4px] px-[8px] py-[2px] text-[9px] font-bold uppercase tracking-[0.10em] text-[#A0A0A0]">{notif.tag}</span>}
                                    <span className="text-[11px] text-[#606060]">Client: {notif.client}</span>
                                  </div>
                                  <p className="text-[11px] text-[#A0A0A0] leading-[1.5] mb-[12px]">{notif.desc}</p>
                                  <div className="flex gap-[8px] text-[11px]"><span className="text-[#FFFFFF]">{notif.stat}</span><span className="text-[#606060]">· {notif.context}</span></div>
                                </div>
                                <div className="text-[11px] text-[#606060]">{notif.time}</div>
                              </div>
                            ))}
                            {filteredNotifications.length === 0 && (
                              <div className="py-[40px] text-center text-[13px] text-[#606060]">Aucune notification pour {inboxSelectedClient}.</div>
                            )}
                          </div>
                        </Container>

                      </div>
                    </div>
                  )}

                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
