<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Layers — Coming Soon</title>
  <meta name="description" content="Layers, l'outil GEO pensé pour les agences SEO. Bientôt disponible."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Mono", monospace;
    }

    /* ── Card 9:16 ── */
    .card {
      position: relative;
      width: min(430px, 100svw);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 52px 40px 58px;
    }

    /* Hero image — covers the card regardless of its own ratio */
    .card__bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .card__bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Dark overlay so text stays readable */
    .card__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.28) 0%,
        rgba(0,0,0,0.15) 40%,
        rgba(0,0,0,0.45) 100%
      );
    }

    /* Geometric corners */
    .geo {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      transform: rotate(45deg);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .geo-tl  { top:-140px; left:-140px; width:360px; height:360px; }
    .geo-tl2 { top:-100px; left:-100px; width:260px; height:260px; border-color:rgba(255,255,255,0.04); }
    .geo-br  { bottom:-140px; right:-140px; width:360px; height:360px; }
    .geo-br2 { bottom:-100px; right:-100px; width:260px; height:260px; border-color:rgba(255,255,255,0.04); }

    /* Content layers above everything */
    .top, .middle, .bottom {
      position: relative;
      z-index: 3;
      width: 100%;
    }

    /* ── Logo ── */
    .top { display: flex; justify-content: center; }
    .logo { width: 130px; display: block; }

    /* ── Headline ── */
    .middle { text-align: left; }
    .headline {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(72px, 19vw, 86px);
      line-height: 0.88;
      color: #f2f2ee;
      letter-spacing: 0.01em;
    }
    /* "Soon." — background shows through via low opacity */
    .headline .soon {
      display: block;
      color: rgba(242,242,238,0.18);
    }

    /* ── Form ── */
    .bottom { display: flex; flex-direction: column; }

    input[type="email"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.28);
      color: #f2f2ee;
      font-family: "DM Mono", monospace;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.04em;
      padding: 10px 0;
      outline: none;
      transition: border-color 0.3s;
      caret-color: #f2f2ee;
    }
    input::placeholder {
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      letter-spacing: 0.07em;
    }
    input:focus { border-bottom-color: #f2f2ee; }

    .cta-btn {
      width: 100%;
      margin-top: 14px;
      background: #f2f2ee;
      color: #0c0c0c;
      border: none;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cta-btn:hover   { background: #d5d5d1; }
    .cta-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .feedback {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
      margin-top: 12px;
      min-height: 14px;
      text-align: center;
    }
    .feedback.ok  { color: #95b895; }
    .feedback.err { color: #b89595; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .top    { animation: fadeUp .6s ease both .08s; }
    .middle { animation: fadeUp .6s ease both .22s; }
    .bottom { animation: fadeUp .6s ease both .38s; }

    /* ── Responsive ── */

    /* Tablet portrait */
    @media (max-width: 768px) and (min-width: 431px) {
      .card {
        width: min(390px, 90svw);
      }
      .headline { font-size: clamp(64px, 16vw, 78px); }
    }

    /* Mobile — full screen */
    @media (max-width: 430px) {
      .card {
        width: 100svw;
        height: 100svh;
        aspect-ratio: unset;
        padding: 44px 30px 50px;
      }
      .headline { font-size: clamp(64px, 18vw, 80px); }
      .logo { width: 110px; }
    }

    /* Very small phones */
    @media (max-width: 360px) {
      .card { padding: 36px 24px 42px; }
      .headline { font-size: 58px; }
      .logo { width: 96px; }
    }
  </style>
</head>
