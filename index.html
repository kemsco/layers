<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layers - Coming Soon</title>
    <!-- Intégration de Tailwind CSS pour le style rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Polices Google : Rajdhani pour le côté tech/futuriste, et Roboto Mono pour le texte -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* Configuration des polices */
        body {
            font-family: 'Roboto Mono', monospace;
            background-color: #030303; /* Noir très profond */
            color: #ffffff;
            margin: 0;
            overflow: hidden; /* Empêche le scroll */
        }

        h1, h2, .tech-font {
            font-family: 'Rajdhani', sans-serif;
        }

        /* Effet de grain (Noise) */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.12; /* Léger grain */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Grille de fond futuriste subtile */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            pointer-events: none;
            /* Masque radial pour estomper la grille sur les bords */
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        }

        /* Lueur derrière le logo */
        .logo-glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            border-radius: 50%;
            animation: pulse 4s infinite alternate;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        @keyframes scanline {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        /* Ligne de scan horizontal façon écran CRT */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            z-index: 40;
            pointer-events: none;
            animation: scanline 6s linear infinite;
        }

        /* Curseur clignotant pour le texte terminal */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Style du champ de saisie tech */
        .tech-input-group {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 400px;
        }
        .tech-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 20px;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
        }
        .tech-input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .tech-button {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            background: #fff;
            color: #000;
            border: none;
            padding: 0 20px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tech-button:hover {
            background: #ccc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Corners de ciblage façon HUD */
        .hud-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: rgba(255, 255, 255, 0.3);
            border-style: solid;
            pointer-events: none;
        }
        .hud-tl { top: -10px; left: -10px; border-width: 2px 0 0 2px; }
        .hud-tr { top: -10px; right: -10px; border-width: 2px 2px 0 0; }
        .hud-bl { bottom: -10px; left: -10px; border-width: 0 0 2px 2px; }
        .hud-br { bottom: -10px; right: -10px; border-width: 0 2px 2px 0; }

    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">

    <!-- Superpositions (Grain, Ligne de Scan, Grille) -->
    <div class="grain-overlay"></div>
    <div class="scanline"></div>
    <div class="bg-grid"></div>

    <!-- Conteneur Principal -->
    <main class="relative z-10 flex flex-col items-center justify-center px-4 text-center w-full max-w-3xl">
        
        <!-- Conteneur Logo avec HUD -->
        <div class="relative mb-12">
            <div class="hud-corner hud-tl"></div>
            <div class="hud-corner hud-tr"></div>
            <div class="hud-corner hud-bl"></div>
            <div class="hud-corner hud-br"></div>
            <div class="logo-glow"></div>
            <!-- Ton logo (Hauteur de 60px max pour qu'il s'intègre bien) -->
            <img src="https://i.ibb.co/7LM46Dg/Layers-logo.png" alt="Layers Logo" class="relative z-10 h-16 md:h-20 object-contain drop-shadow-2xl opacity-90 hover:opacity-100 transition-opacity duration-500">
        </div>

        <!-- Titre Principal -->
        <h1 class="tech-font text-5xl md:text-7xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-4 uppercase">
            Coming Soon
        </h1>

        <!-- Texte terminal animé en JS -->
        <div class="h-12 mb-8">
            <p class="text-gray-400 text-sm md:text-base tracking-wide">
                <span id="typewriter"></span><span class="cursor-blink">_</span>
            </p>
        </div>

        <!-- Formulaire d'attente (prêt à être branché sur Instantly / Webflow) -->
        <div class="w-full max-w-md mt-4 relative">
            <form onsubmit="event.preventDefault(); fetch('https://formspree.io/f/mgolpzak', { method: 'POST', body: new FormData(this), headers: { 'Accept': 'application/json' } }).then(() => { document.getElementById('success-msg').classList.remove('hidden'); document.getElementById('helper-text').classList.add('hidden'); this.style.opacity = '0.5'; });" class="tech-input-group">
                <input type="email" name="email" placeholder="ENTER EMAIL ADDRESS..." required class="tech-input">
                <button type="submit" class="tech-button">NOTIFY ME</button>
            </form>
            <p id="helper-text" class="text-gray-500 text-[11px] mt-2 font-mono tracking-widest uppercase">
                > Get to know when we're live.
            </p>
            <p id="success-msg" class="hidden text-green-400 text-xs mt-3 font-mono tracking-widest uppercase">
                > System initialized... Priority access granted.
            </p>
        </div>

        <!-- Coordonnées / Statut Système en bas (déco tech) -->
        <div class="absolute bottom-[-100px] text-[10px] text-gray-600 flex justify-between w-full max-w-sm font-mono tracking-widest">
            <span>SYS.STATUS: <span class="text-green-500">ONLINE</span></span>
            <span>V 1.0.0 // PROTOCOL: LAYERS</span>
        </div>

    </main>

    <!-- Script pour l'effet machine à écrire -->
    <script>
        const textToType = "> Initialisation du système Layers... Préparation de la prochaine interface.";
        const typeWriterElement = document.getElementById('typewriter');
        let i = 0;

        function typeWriter() {
            if (i < textToType.length) {
                typeWriterElement.innerHTML += textToType.charAt(i);
                i++;
                // Vitesse de frappe aléatoire pour un effet plus naturel/tech
                const speed = Math.random() * 50 + 30; 
                setTimeout(typeWriter, speed);
            }
        }

        // Lancement de l'animation après un court délai
        window.onload = () => {
            setTimeout(typeWriter, 1000);
        };
    </script>

</body>
</html>
